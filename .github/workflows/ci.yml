name: ci
on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Helper selftest
        run: python3 assets/omarchy-router selftest

      - name: Model test
        # The panel's identity helpers are only reachable from QML, so the
        # Python selftest above cannot cover them. This is where the duplicate
        # Brave rows came from.
        run: node scripts/model-test.js

      - name: Installer syntax
        run: bash -n install.sh

      - name: Manifest integrity
        run: python3 scripts/check-manifest.py

      - name: QML lint
        run: |
          # qmllint lives in the Qt6 tree rather than on PATH: qt6-declarative
          # on Arch, qt6-declarative-dev-tools on Debian/Ubuntu. The script
          # finds it, builds the qs.* import shim when an omarchy shell is
          # present, and fails only on parse errors (qmllint exits 0 for
          # warnings). Without the shell the qs.* types cannot resolve here, so
          # this run is a syntax check.
          sudo apt-get update -qq
          sudo apt-get install -y -qq qt6-declarative-dev-tools
          ./scripts/qml-lint.sh
